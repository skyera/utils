# ==============================================================================
# UI & UOSC Integration (Required for uosc)
# ==============================================================================
osc=no                      # Disable default mpv OSC interface
osd-bar=no                  # Disable default OSD bar
border=no                   # Hide window borders for a clean minimalist UI

# ==============================================================================
# Video & Hardware Acceleration
# ==============================================================================
vo=gpu-next                 # Modern high-performance GPU video rendering pipeline
hwdec=auto-safe             # Enable safe hardware video decoding (NVDEC/D3D11VA/VAAPI)
gpu-api=auto                # Automatically select best GPU API (Vulkan / D3D11 / OpenGL)

# ==============================================================================
# Subtitles & Audio Auto-loading
# ==============================================================================
sub-auto=fuzzy              # Auto-load external subtitles matching video file name
sub-file-paths=sub:subtitles:subs  # Look for subtitles in subfolders
slang=en,eng,enUS,en-US,en-GB,zh,chi,zh-Hans,zh-Hant # Prioritize English first, then Chinese
alang=en,eng,ja,jpn         # Preferred audio track languages

sub-font-size=40            # Subtitle font size
sub-border-size=2           # Clear black outline around subtitles
sub-visibility=yes          # Display subtitles by default when available

# YouTube & online video auto subtitle fetching via yt-dlp
ytdl-raw-options-append=write-sub=
ytdl-raw-options-append=write-auto-sub=
ytdl-raw-options-append=sub-lang="en.*,en,eng,zh.*,zh,chi"

audio-file-auto=fuzzy       # Auto-load external audio files matching video file name
volume=100                  # Default volume level
volume-max=150              # Maximum volume gain percentage

# ==============================================================================
# Playback & Window Behavior
# ==============================================================================
keep-open=yes               # Keep player open after video finishes playing
save-position-on-quit=yes   # Automatically save and resume playback position on quit
autofit-larger=85%x85%      # Limit initial window size to 85% of screen size

# ==============================================================================
# Screenshots
# ==============================================================================
screenshot-format=png       # Save screenshots in high-quality PNG format
screenshot-template="%F-%P" # Filename template: <video_name>-<timestamp>
