# Starship configuration - Catppuccin Mocha Powerline preset with NFS-optimized git settings
#
# NFS optimization: git_status is disabled to avoid expensive working-tree
# walks over network mounts. git_branch is kept (cheap: reads .git/HEAD).

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
scan_timeout = 10

format = """
[░▒▓](#b4befe)\
$os\
[](bg:#89b4fa fg:#b4befe)\
$directory\
[](fg:#89b4fa bg:#45475a)\
$git_branch\
$git_status\
[](fg:#45475a bg:#181825)\
$time\
[ ](fg:#181825)\
\n$character"""

[directory]
style = "fg:#11111b bg:#89b4fa"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#45475a"
format = '[[ $symbol $branch ](fg:#cba6f7 bg:#45475a)]($style)'

[git_status]
# Disabled for NFS performance - re-enable by setting disabled = false
disabled = true
style = "bg:#45475a"
format = '[[($all_status$ahead_behind )](fg:#cba6f7 bg:#45475a)]($style)'

[c]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89b4fa bg:#313244)]($style)'
detect_extensions = []

[python]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89b4fa bg:#313244)]($style)'
detect_extensions = []

[nodejs]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89b4fa bg:#313244)]($style)'
detect_extensions = []

[bun]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89b4fa bg:#313244)]($style)'
detect_extensions = []

[rust]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89b4fa bg:#313244)]($style)'
detect_extensions = []

[golang]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89b4fa bg:#313244)]($style)'
detect_extensions = []

[php]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89b4fa bg:#313244)]($style)'
detect_extensions = []

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#181825"
format = '[[  $time ](fg:#bac2de bg:#181825)]($style)'

[os]
style = "bg:#b4befe fg:#11111b"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
